# CI (Fase K): en cada PR y en cada push a main, GitHub corre el lint y las pruebas.
# Si algo falla, el PR lo muestra en rojo ANTES de fusionarlo.
# Las variables de aquí son de PRUEBA (no secretos): las pruebas no envían correos ni
# usan S3 de verdad (NODE_ENV=test los deja en memoria).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si llega otro push al mismo PR, se cancela la corrida vieja (no gasta minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'

jobs:
  backend:
    name: Backend (lint + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # PostgreSQL de verdad para test:db (cada corrida crea y borra su propia base).
      db:
        image: postgres:18.6
        env:
          POSTGRES_USER: hallazgo
          POSTGRES_PASSWORD: clave-solo-para-ci
          POSTGRES_DB: hallazgo_ud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hallazgo -d hallazgo_ud"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://hallazgo:clave-solo-para-ci@localhost:5432/hallazgo_ud
      URL_FRONTEND: http://localhost:3001
      JWT_SECRET: valor-de-prueba-para-ci-de-mas-de-32-caracteres
      JWT_EXPIRA_EN: 1d
      BCRYPT_COSTE: '10'
      DOMINIO_CORREO: udistrital.edu.co
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: HallazGO UD <ci@hallazgo.local>
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: hallazgo-imagenes
      S3_ACCESS_KEY: llave-ci
      S3_SECRET_KEY: secreto-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint (con tipos)
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Unitarias + cobertura (falla si baja del 60 %, RNF-14)
        run: npm run test:cov
      - name: E2E
        run: npm run test:e2e
      - name: Contra PostgreSQL
        run: npm run test:db
      - name: Compila
        run: npm run build

  frontend:
    name: Frontend (lint + tipos + compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (React, Next.js y accesibilidad)
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Tipos
        run: npm run typecheck
      - name: Compila (producción)
        run: npm run build

  imagenes:
    name: Imágenes Docker de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Backend
        run: docker build -t hallazgo-backend backend
      - name: Migraciones
        run: docker build -t hallazgo-migrar --target migrar backend
      - name: Frontend
        run: docker build -t hallazgo-frontend frontend
