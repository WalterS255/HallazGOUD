# HallazGO UD · servicios de apoyo para desarrollo local
#   docker compose up -d      → levanta todo
#   docker compose ps         → ver estado
#   docker compose down       → apaga (los datos se conservan en los volúmenes)
# Las credenciales salen del archivo .env (copia .env.example a .env).

name: hallazgo

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC  # se guarda en UTC; la app muestra en America/Bogota (RNF-20)
    ports:
      # 127.0.0.1 = solo accesible desde tu PC, no desde la red del café o la U.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Desde Postgres 18 el volumen se monta en /var/lib/postgresql (antes era .../data).
      - db_datos:/var/lib/postgresql
      # Scripts de la Fase A, solo lectura, para practicar con psql.
      - ./docs/sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # SeaweedFS: almacenamiento de imágenes compatible con S3 (reemplaza a MinIO, ver CLAUDE.md §4).
    # El backend le habla con el SDK de S3, así que cambiar de proveedor solo cambia el .env.
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      # Llaves de administrador del S3. Sin ellas, SeaweedFS acepta peticiones anónimas.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8333:8333"  # API S3: aquí sube y descarga el backend
      # Explorador de archivos (filer): http://localhost:8888. NO tiene contraseña:
      # sirve para aprender en local, pero en el VPS este puerto nunca se publica.
      - "127.0.0.1:8888:8888"
    volumes:
      - s3_datos:/data

  mailpit:
    # Atrapa todos los correos que envíe el backend; nada sale a Internet.
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP: aquí envía el backend
      - "127.0.0.1:8025:8025"  # Interfaz web: http://localhost:8025

volumes:
  db_datos:
  s3_datos:
